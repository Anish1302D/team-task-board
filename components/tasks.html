<main class="tasks-root">
    <header class="tasks-header">
        <h1>Our Tasks</h1>
        <div class="tasks-controls">
            <a class="btn btn-secondary" href="navbar.html" aria-label="Back to navbar page">Back</a>
            <button id="themeToggle" class="btn btn-secondary" type="button" aria-label="Toggle page theme">Toggle Theme</button>
            <input id="taskSearch" type="search" placeholder="Search tasks" aria-label="Search tasks">
            <select id="statusFilter" aria-label="Filter by status">
                <option value="all">All</option>
                <option value="completed">Completed</option>
                <option value="in-progress">In Progress</option>
                <option value="pending">Pending</option>
            </select>
        </div>
    </header>

    <section aria-labelledby="taskListLabel">
        <h2 id="taskListLabel" class="visually-hidden">Task list</h2>
        <ul class="task-grid" id="taskList"></ul>
    </section>

    <p class="tasks-note">Tip: Use the search box or filter to find tasks quickly.</p>

    <div id="taskFormContainer" style="display:none; margin-top:1rem;">
        <form id="taskForm" style="max-width:420px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:1rem; box-shadow:0 1px 3px rgba(16,24,40,0.06);">
            <h3 style="margin-top:0; margin-bottom:0.75rem;">Create New Task</h3>
            <label style="display:block; font-weight:600; margin-bottom:0.75rem;">
                Task title
                <input id="taskTitleInput" type="text" placeholder="Enter task title" required style="width:100%; margin-top:0.35rem; padding:0.65rem 0.75rem; border:1px solid #d1d5db; border-radius:8px;">
            </label>
            <label style="display:block; font-weight:600; margin-bottom:0.75rem;">
                Status
                <select id="taskStatusInput" style="width:100%; margin-top:0.35rem; padding:0.65rem 0.75rem; border:1px solid #d1d5db; border-radius:8px;">
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </label>
            <div style="display:flex; gap:0.75rem;">
                <button type="submit" class="btn btn-secondary" style="background:#111827;color:#fff;">Save Task</button>
                <button type="button" id="cancelTaskForm" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>

    <style>
        body{margin:0;background:#f5f7fb;color:#111827;transition:background-color .2s ease,color .2s ease}
        body.dark-theme{background:#111827;color:#f3f4f6}
        .tasks-root{font-family:Segoe UI,Roboto,Arial,system-ui;margin:0;padding:1rem}
        .tasks-header{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
        .tasks-controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
        input[type=search]{padding:.5rem .6rem;border:1px solid #d0d7de;border-radius:6px;background:#fff;color:#111827}
        select{padding:.45rem .6rem;border:1px solid #d0d7de;border-radius:6px;background:#fff;color:#111827}
        .task-grid{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
        .task article{display:flex;justify-content:space-between;align-items:center;padding:.8rem;border:1px solid #e6e9ed;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,0.03);color:#111827}
        .task-main{display:flex;gap:.75rem;align-items:center;cursor:pointer}
        .task-main input[type=checkbox]{width:18px;height:18px}
        .task h3{margin:0;font-size:1rem}
        .meta{margin:0;color:#6b7280;font-size:.85rem}
        .task-actions{display:flex;gap:.5rem}
        .task article:hover{transform:translateY(-4px);transition:transform .12s ease,box-shadow .12s ease;box-shadow:0 8px 24px rgba(16,24,40,0.06)}
        .status-badge{display:inline-block;padding:.25rem .5rem;border-radius:999px;font-weight:700;font-size:.78rem}
        li[data-status="completed"] .status-badge{background:#dcfce7;color:#166534}
        li[data-status="in-progress"] .status-badge{background:#fef3c7;color:#92400e}
        li[data-status="pending"] .status-badge{background:#e0f2fe;color:#075985}
        .fab{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;font-size:28px;background:#2563eb;color:#fff;border:none;box-shadow:0 8px 24px rgba(37,99,235,0.18);cursor:pointer}
        .fab:focus{outline:3px solid rgba(37,99,235,0.18);outline-offset:4px}
        .btn{padding:.4rem .6rem;border-radius:6px;border:1px solid transparent;font-size:.85rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
        .btn-secondary{background:#f3f4f6;color:#111827;border-color:#e5e7eb}
        .btn-danger{background:#fff5f5;color:#7f1d1d;border-color:#fecaca}
        .btn:focus{outline:2px solid #60a5fa;outline-offset:2px}
        .tasks-note{margin-top:1rem;color:#6b7280;font-size:.9rem}
        .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
        body.dark-theme .tasks-root{color:#f3f4f6}
        body.dark-theme input[type=search],
        body.dark-theme select,
        body.dark-theme .task article,
        body.dark-theme .btn-secondary{background:#1f2937;color:#f3f4f6;border-color:#374151}
        body.dark-theme .task article{box-shadow:none}
        body.dark-theme .meta,
        body.dark-theme .tasks-note{color:#d1d5db}
        body.dark-theme .btn-danger{background:#3b1d1d;color:#fecaca;border-color:#7f1d1d}
        @media (max-width:520px){.tasks-header{flex-direction:column;align-items:stretch}.tasks-controls{width:100%}.tasks-controls > *{flex:1}}
    </style>

    <script>
        (function(){
            const search = document.getElementById('taskSearch');
            const filter = document.getElementById('statusFilter');
            const list = document.getElementById('taskList');
            const themeToggle = document.getElementById('themeToggle');
            const taskFormContainer = document.getElementById('taskFormContainer');
            const taskForm = document.getElementById('taskForm');
            const taskTitleInput = document.getElementById('taskTitleInput');
            const taskStatusInput = document.getElementById('taskStatusInput');
            const cancelTaskForm = document.getElementById('cancelTaskForm');

            function normalize(value) {
                return (value || '').trim().toLowerCase();
            }

            function statusLabel(status) {
                const labels = {
                    completed: 'Completed',
                    'in-progress': 'In Progress',
                    pending: 'Pending'
                };
                return labels[status] || 'Pending';
            }

            function renderTasks(tasks) {
                list.innerHTML = '';

                tasks.forEach((task) => {
                    const li = document.createElement('li');
                    li.className = 'task';
                    li.dataset.status = task.status;
                    li.innerHTML = `
                        <article>
                            <label class="task-main">
                                <input type="checkbox" ${task.status === 'completed' ? 'checked' : ''} aria-label="Mark ${task.title} complete">
                                <div>
                                    <h3>${task.title}</h3>
                                    <p class="meta"><span class="status-badge">${statusLabel(task.status)}</span></p>
                                </div>
                            </label>
                            <div class="task-actions">
                                <button class="btn btn-secondary" data-action="edit" type="button">Edit</button>
                                <button class="btn btn-danger" data-action="delete" type="button">Delete</button>
                            </div>
                        </article>
                    `;

                    const checkbox = li.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', async (event) => {
                        await updateTask(task.id, { status: event.target.checked ? 'completed' : 'in-progress' });
                        await loadTasks();
                    });

                    li.querySelector('[data-action="edit"]').addEventListener('click', async () => {
                        const updatedTitle = prompt('Edit task title', task.title);
                        if (!updatedTitle || !updatedTitle.trim()) return;
                        await updateTask(task.id, { title: updatedTitle.trim() });
                        await loadTasks();
                    });

                    li.querySelector('[data-action="delete"]').addEventListener('click', async () => {
                        if (!confirm(`Delete task: ${task.title}?`)) return;
                        await deleteTask(task.id);
                        await loadTasks();
                    });

                    list.appendChild(li);
                });

                applyFilters();
            }

            function applyFilters() {
                const query = normalize(search.value);
                const selectedStatus = filter.value;

                Array.from(list.children).forEach((li) => {
                    const title = normalize(li.querySelector('h3').textContent);
                    const itemStatus = li.dataset.status;
                    const matchesQuery = query === '' || title.includes(query);
                    const matchesStatus = selectedStatus === 'all' || itemStatus === selectedStatus;
                    li.style.display = matchesQuery && matchesStatus ? '' : 'none';
                });
            }

            async function loadTasks() {
                try {
                    const response = await fetch('/api/tasks');
                    if (!response.ok) throw new Error('Failed to load tasks');
                    const tasks = await response.json();
                    renderTasks(tasks);
                } catch (error) {
                    list.innerHTML = '<li class="task"><article><div><h3>Unable to load tasks</h3><p class="meta"><span class="status-badge">Error</span></p></div></article></li>';
                }
            }

            async function updateTask(id, updates) {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                if (!response.ok) {
                    throw new Error('Task update failed');
                }
            }

            async function deleteTask(id) {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Task delete failed');
                }
            }

            function toggleTheme() {
                document.body.classList.toggle('dark-theme');
                const isDark = document.body.classList.contains('dark-theme');
                themeToggle.textContent = isDark ? 'Light Theme' : 'Toggle Theme';
                localStorage.setItem('taskTheme', isDark ? 'dark' : 'light');
            }

            const savedTheme = localStorage.getItem('taskTheme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggle.textContent = 'Light Theme';
            }

            themeToggle.addEventListener('click', toggleTheme);
            search.addEventListener('input', applyFilters);
            filter.addEventListener('change', applyFilters);

            function showTaskForm() {
                taskFormContainer.style.display = 'block';
                taskTitleInput.focus();
            }

            function hideTaskForm() {
                taskFormContainer.style.display = 'none';
                taskForm.reset();
                taskStatusInput.value = 'pending';
            }

            document.getElementById('addTaskFab')?.addEventListener('click', showTaskForm);

            if (taskForm) {
                taskForm.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const title = taskTitleInput.value.trim();
                    const status = taskStatusInput.value;

                    if (!title) return;

                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, status })
                    });

                    if (response.ok) {
                        hideTaskForm();
                        await loadTasks();
                    }
                });
            }

            if (cancelTaskForm) {
                cancelTaskForm.addEventListener('click', hideTaskForm);
            }

            loadTasks();
        })();
    </script>

    <button id="addTaskFab" class="fab" aria-label="Add Task">+</button>
</main>
