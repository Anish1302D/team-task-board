<main class="container" id="taskbarRoot">
    <section class="card">
        <h1 style="margin-top:0">Taskbar</h1>
        <p>Quick actions and shortcuts for managing tasks.</p>

        <div class="actions">
            <button id="openTasks">Open Tasks</button>
            <button id="newTask">Create New Task</button>
            <button id="refresh">Refresh</button>
        </div>

        <div id="status" style="margin-top:1rem;color:#374151"></div>
    </section>

    <section class="tasks-panel card">
        <h2>Tasks</h2>

        <ul class="task-list">
            <li class="task-item">
                <div>
                    <strong>Design landing page</strong>
                </div>
                <span class="task-status in-progress">In Progress</span>
            </li>
            <li class="task-item">
                <div>
                    <strong>Review pull requests</strong>
                </div>
                <span class="task-status pending">Pending</span>
            </li>
            <li class="task-item">
                <div>
                    <strong>Prepare sprint summary</strong>
                </div>
                <span class="task-status completed">Completed</span>
            </li>
        </ul>
    </section>
</main>

<script>
    (function(){
        const openTasks = document.getElementById('openTasks');
        const newTask = document.getElementById('newTask');
        const refresh = document.getElementById('refresh');
        const status = document.getElementById('status');

        if(openTasks) openTasks.addEventListener('click', ()=>{ window.location.href = 'tasks.html'; });
        if(newTask) newTask.addEventListener('click', ()=>{ status.textContent = 'Create task clicked (placeholder)'; });
        if(refresh) refresh.addEventListener('click', ()=>{ status.textContent = 'Refreshed at ' + new Date().toLocaleTimeString(); });
    })();
</script>
