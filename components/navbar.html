<main class="container" id="taskbarRoot">
    <section class="card">
        <h1 style="margin-top:0">Taskbar</h1>
        <p>Quick actions and shortcuts for managing tasks.</p>

        <div class="actions">
            <button id="openTasks">Open Tasks</button>
            <button id="newTask">Create New Task</button>
            <button id="refresh">Refresh</button>
        </div>

        <div id="status" style="margin-top:1rem;color:#374151"></div>
    </section>

    <section class="tasks-panel card">
        <h2>Tasks</h2>
        <div id="taskFormContainer" class="task-form-container">
            <form id="taskForm" class="task-form">
                <h3>Create New Task</h3>
                <label>
                    Task title
                    <input id="taskTitleInput" name="title" type="text" placeholder="Enter task title" required>
                </label>

                <label>
                    Status
                    <select id="taskStatusInput" name="status">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </label>

                <div class="task-form-actions">
                    <button type="submit">Save Task</button>
                    <button type="button" id="cancelTaskForm">Cancel</button>
                </div>
            </form>
        </div>
        <ul class="task-list" id="taskList"></ul>
    </section>
</main>

<script>
    (function(){
        const openTasks = document.getElementById('openTasks');
        const newTask = document.getElementById('newTask');
        const refresh = document.getElementById('refresh');
        const status = document.getElementById('status');
        const taskList = document.getElementById('taskList');
        const taskFormContainer = document.getElementById('taskFormContainer');
        const taskForm = document.getElementById('taskForm');
        const taskTitleInput = document.getElementById('taskTitleInput');
        const taskStatusInput = document.getElementById('taskStatusInput');
        const cancelTaskForm = document.getElementById('cancelTaskForm');

        function mapStatus(status) {
            const statusMap = {
                'completed': 'Completed',
                'in-progress': 'In Progress',
                pending: 'Pending'
            };
            return statusMap[status] || 'Pending';
        }

        function renderTasks(tasks) {
            taskList.innerHTML = '';

            tasks.forEach(task => {
                const item = document.createElement('li');
                item.className = 'task-item';
                item.innerHTML = `
                    <div>
                        <strong>${task.title}</strong>
                    </div>
                    <span class="task-status ${task.status}">${mapStatus(task.status)}</span>
                `;
                taskList.appendChild(item);
            });
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();
                renderTasks(tasks);
                status.textContent = `Loaded ${tasks.length} task(s).`;
            } catch (error) {
                status.textContent = 'Unable to load tasks from the server data file.';
            }
        }

        function showTaskForm() {
            taskFormContainer.classList.add('visible');
            taskTitleInput.focus();
        }

        function hideTaskForm() {
            taskFormContainer.classList.remove('visible');
            taskForm.reset();
            taskStatusInput.value = 'pending';
        }

        if(openTasks) openTasks.addEventListener('click', ()=>{ window.location.href = 'tasks.html'; });
        if(newTask) newTask.addEventListener('click', showTaskForm);

        if(taskForm) {
            taskForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const title = taskTitleInput.value.trim();
                const status = taskStatusInput.value;

                if (!title) {
                    status.textContent = 'Task title is required.';
                    return;
                }

                try {
                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, status })
                    });

                    if (!response.ok) throw new Error('Task could not be created.');
                    const task = await response.json();
                    hideTaskForm();
                    status.textContent = `Created task: ${task.title}`;
                    loadTasks();
                } catch (error) {
                    status.textContent = error.message;
                }
            });
        }

        if(cancelTaskForm) cancelTaskForm.addEventListener('click', hideTaskForm);
        if(refresh) refresh.addEventListener('click', ()=>{ loadTasks(); status.textContent = 'Refreshed at ' + new Date().toLocaleTimeString(); });

        loadTasks();
    })();
</script>
